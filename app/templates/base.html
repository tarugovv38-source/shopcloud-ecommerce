<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}E-Commerce{% endblock %} · ShopCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #161920;
      --border:   #252932;
      --accent:   #00e5a0;
      --accent2:  #ff6b35;
      --text:     #e8eaf0;
      --muted:    #6b7280;
      --danger:   #ff4757;
      --radius:   10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    nav {
      width: 220px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 28px 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--accent);
      padding: 0 24px 32px;
      letter-spacing: -0.5px;
    }
    .nav-logo span { color: var(--text); }

    .nav-section {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 24px 8px;
      margin-top: 16px;
    }

    nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color .15s, background .15s;
      border-left: 2px solid transparent;
    }
    nav a:hover { color: var(--text); background: rgba(255,255,255,.04); }
    nav a.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0,229,160,.05); }
    nav a .icon { font-size: 1rem; width: 18px; text-align: center; }

    main {
      margin-left: 220px;
      flex: 1;
      padding: 40px 48px;
      max-width: 1100px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .page-sub {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 36px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 700; }
    .stat-card.green .stat-value { color: var(--accent); }
    .stat-card.orange .stat-value { color: var(--accent2); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 28px;
    }
    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 12px 20px;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 13px 20px;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .form-card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    label { font-size: 0.75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface); }
    textarea { resize: vertical; min-height: 70px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity .15s, transform .1s;
      text-decoration: none;
    }
    .btn:hover { opacity: .85; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 5px 12px; font-size: 0.8rem; }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .badge-pendente  { background: rgba(255,107,53,.15); color: var(--accent2); }
    .badge-pago      { background: rgba(0,229,160,.15);  color: var(--accent); }
    .badge-cancelado { background: rgba(255,71,87,.15);  color: var(--danger); }

    .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">Shop<span>Cloud</span></div>

    <div class="nav-section">Painel</div>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
      <span class="icon">◈</span> Dashboard
    </a>

    <div class="nav-section">Gestão</div>
    <a href="/produtos" class="{% if '/produtos' in request.url.path %}active{% endif %}">
      <span class="icon">⊞</span> Produtos
    </a>
    <a href="/clientes" class="{% if '/clientes' in request.url.path %}active{% endif %}">
      <span class="icon">◉</span> Clientes
    </a>
    <a href="/pedidos" class="{% if '/pedidos' in request.url.path %}active{% endif %}">
      <span class="icon">◎</span> Pedidos
    </a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
